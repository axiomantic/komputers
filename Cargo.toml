[workspace]
members = [
    "kompute-sys",
    "komputers"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Komputers Team <team@komputers.dev>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/axiomantic/komputers"
homepage = "https://github.com/axiomantic/komputers"
documentation = "https://docs.rs/komputers"
description = "Production-ready Rust bindings for GPU computing with Vulkan"
keywords = ["gpu", "vulkan", "compute", "tensor", "parallel", "ml", "ai", "kompute-bindings"]
categories = ["graphics", "science", "mathematics", "algorithms", "development-tools"]
readme = "README.md"
rust-version = "1.70"

[workspace.dependencies]
# FFI and C++ integration
bindgen = "0.69"
cc = "1.0"
cmake = "0.1"

# Vulkan integration
ash = "0.37"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async support (for future use)
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "test-util", "macros"] }
futures = "0.3"

# Testing and benchmarking
criterion = "0.5"
proptest = "1.0"

# Development dependencies
env_logger = "0.10"
log = "0.4"

# GLSL compilation utilities
tempfile = "3.0"

[profile.dev]
debug = true
overflow-checks = true

[profile.release]
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
debug = true
lto = true

# Features for optional functionality
[workspace.metadata.features]
default = []
async = ["tokio"]
validation = []  # Enable Vulkan validation layers
