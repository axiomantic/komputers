# =============================================================================

validation_matrix:
  # Scenarios caught at compile time (80%+ of errors)
  compile_time_scenarios:
    async_sync_mixing:
      description: "AsyncSequence with SyncTensor operations"
      prevention_method: "Type system with phantom types"
      error_type: "Compile error"

    object_type_mismatches:
      description: "Tensor handle used in algorithm operations"
      prevention_method: "Typed handles with object type markers"
      error_type: "Compile error"

    manager_type_mismatches:
      description: "AsyncManager<ID1> objects with SyncManager<ID2> operations"
      prevention_method: "Manager type parameters"
      error_type: "Compile error"

  # Scenarios requiring runtime validation (20% of errors)
  runtime_scenarios:
    manager_instance_mismatches:
      description: "SyncManager<ID> instance A with SyncManager<ID> instance B"
      prevention_method: "Runtime manager instance ID checking"
      error_type: "Runtime validation error"

    handle_lifecycle_violations:
      description: "Handle used after manager destruction"
      prevention_method: "Runtime handle validity checking"
      error_type: "Runtime validation error"

    complex_workflow_violations:
      description: "Multi-manager workflows with mixed patterns"
      prevention_method: "Runtime workflow analysis"
      error_type: "Runtime validation error"

