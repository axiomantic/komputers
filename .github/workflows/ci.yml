  gpu-tests-self-hosted:
    name: GPU Tests (Self-Hosted macOS)
    runs-on: self-hosted
    if: ${{ github.repository_owner == 'axiomantic' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Development Environment
        run: |
          echo "🔧 Configuring development environment for self-hosted runner"

          # Ensure Homebrew and Rust are in PATH
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

          # Configure sccache for much faster compilation
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_CACHE_SIZE=2G" >> $GITHUB_ENV
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

          # Initialize sccache
          mkdir -p $HOME/.cache/sccache
          sccache --show-stats
          echo "sccache configured with cache dir: $HOME/.cache/sccache"

          # Verify essential build tools
          cmake --version
          rustc --version
          cargo --version
          rustfmt --version || echo "rustfmt not found, installing..."
          clippy-driver --version || echo "clippy not found, installing..."

          # Set Rust version for cache key consistency
          echo "RUSTC_VERSION=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_ENV

          # Install missing Rust components if needed
          rustup component add rustfmt clippy 2>/dev/null || echo "Components already installed"

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}-${{ env.RUSTC_VERSION }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-sccache-

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Target Directory
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}-${{ env.RUSTC_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-target-

      - name: Cache CMake Build Output
        uses: actions/cache@v4
        with:
          path: |
            target/release/build/kompute-sys-*/out/
            target/debug/build/kompute-sys-*/out/
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('kompute-sys/build.rs') }}-${{ hashFiles('kompute-sys/Cargo.toml') }}-kompute-master
          restore-keys: |
            ${{ runner.os }}-cmake-build-${{ hashFiles('kompute-sys/build.rs') }}-
            ${{ runner.os }}-cmake-build-

      - name: Cache Downloaded Sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake/
            /tmp/kompute-*
            /tmp/fmt-*
            /tmp/spdlog-*
          key: ${{ runner.os }}-sources-kompute-master-${{ hashFiles('kompute-sys/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-sources-kompute-master-
            ${{ runner.os }}-sources-

      - name: Setup Local Cache Directories
        run: |
          echo "🗂️  Setting up local cache directories for self-hosted runner"

          # Create persistent cache directories on self-hosted runner
          mkdir -p ~/.cache/komputers/{cargo,cmake,sources}
          mkdir -p ~/.cache/komputers/build-metrics

          # Set cache size limits to prevent disk bloat (optional cleanup)
          echo "Cache directories created for persistent storage"

          # Log current cache usage
          echo "Current cache usage:"
          du -sh ~/.cache/komputers/ 2>/dev/null || echo "No existing cache"

          # Set environment variables for cache monitoring
          echo "CACHE_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Validate GPU Environment
        run: |
          echo "🍎 Validating macOS GPU Environment"
          vulkaninfo --summary || echo "Vulkan check failed"
          system_profiler SPDisplaysDataType | grep -A 5 "Chipset Model" || echo "GPU info not found"

      - name: Verify sccache Configuration
        run: |
          echo "🔧 Verifying sccache configuration"
          echo "RUSTC_WRAPPER: $RUSTC_WRAPPER"
          echo "SCCACHE_DIR: $SCCACHE_DIR"
          echo "SCCACHE_CACHE_SIZE: $SCCACHE_CACHE_SIZE"
          sccache --show-stats
          echo "✅ sccache is ready"

      - name: Build all features
        run: |
          echo "🔨 Building with sccache acceleration"
          cargo build --features "async,glsl,debug,validation,test-utils" --release

      - name: Run complete test suite
        run: |
          echo "🧪 Running complete test suite with GPU support"
          cargo test --features "async,glsl,debug,validation,test-utils" --workspace -- --nocapture

      - name: Run GPU integration tests
        run: |
          echo "🚀 Running GPU-specific integration tests"
          cargo test --test gpu_compute_integration --features kompute-master -- --nocapture
          cargo test --test cross_platform_integration --features kompute-master -- --nocapture
          cargo test --test gpu_vendor_compatibility_matrix --features kompute-master -- --nocapture

      - name: Run ignored tests (GPU required)
        run: |
          echo "🔥 Running tests that require real GPU hardware"
          cargo test --features "async,glsl,debug,validation,test-utils" -- --ignored --nocapture

      - name: Test examples with GPU
        run: |
          echo "📋 Testing examples with real GPU"
          timeout 60 cargo run --example basic_gpu_computing --features kompute-master || echo "Example timeout (expected)"
          timeout 60 cargo run --example multi_type_tensors --features kompute-master || echo "Example timeout (expected)"

      - name: Cache Performance Report
        if: always()
        run: |
          echo "📊 Build and Cache Performance Report"
          echo "=================================="

          # Show sccache statistics
          echo "🏎️  sccache Statistics:"
          sccache --show-stats || echo "sccache stats unavailable"
          echo ""

          # Calculate total build time
          BUILD_END_TIME=$(date +%s)
          TOTAL_TIME=$((BUILD_END_TIME - CACHE_START_TIME))
          echo "Total build time: ${TOTAL_TIME} seconds"

          # Report cache usage
          echo ""
          echo "Final cache usage:"
          du -sh ~/.cache/komputers/ 2>/dev/null || echo "No cache directory"

          echo ""
          echo "Cargo target directory size:"
          du -sh target/ 2>/dev/null || echo "No target directory"

          echo ""
          echo "Cache hit indicators:"
          if [ -d "target/release/build/kompute-sys-"*"/out/kompute_build" ]; then
            echo "✅ CMake cache likely hit (kompute_build exists)"
          else
            echo "❌ CMake cache miss (fresh build)"
          fi

          # Save metrics for trend analysis
          echo "$(date): ${TOTAL_TIME}s" >> ~/.cache/komputers/build-metrics/build-times.log

