name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  KOMPUTE_DISABLE_ASAN: 1 # Disable ASAN in CI to avoid linking issues
  KOMPUTE_DISABLE_VULKAN_CHECK: 1 # Disable Vulkan version check in CI where GPU drivers aren't available

