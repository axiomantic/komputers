name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Platform-specific dependencies
      - name: Install Vulkan SDK (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y vulkan-tools libvulkan-dev vulkan-validationlayers-dev cmake build-essential

      - name: Install Vulkan SDK (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install vulkan-headers vulkan-loader molten-vk cmake

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Download and install Vulkan SDK
          Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
          Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "/S" -Wait
          echo "C:\VulkanSDK\$(Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1 Name)\Bin" >> $env:GITHUB_PATH

      # Build and test
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-features --workspace -- -D warnings

      - name: Build (default features)
        run: cargo build --verbose

      - name: Build (all features)
        run: cargo build --all-features --verbose

      - name: Run unit tests
        run: cargo test --lib --all-features --verbose

      - name: Run documentation tests
        run: cargo test --doc --all-features

      - name: Build examples
        run: cargo build --examples --all-features

      # GPU tests only on platforms where they're likely to work
      - name: Run GPU integration tests (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Only run if Vulkan/MoltenVK is available
          if vulkaninfo --summary >/dev/null 2>&1; then
            echo "Vulkan detected, running GPU tests"
            cargo test --test gpu_compute_integration --features kompute-master -- --nocapture || echo "GPU tests failed (expected on CI)"
          else
            echo "No Vulkan support detected, skipping GPU tests"
          fi

      - name: Run memory safety tests
        run: cargo test memory_safety --all-features -- --nocapture

      - name: Generate documentation
        run: cargo doc --all-features --no-deps --workspace
