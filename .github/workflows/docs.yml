name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for versioned docs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        run: |
          sudo apt update
          sudo apt install -y vulkan-tools libvulkan-dev cmake build-essential

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate current documentation
        run: |
          cargo doc --all-features --no-deps
          # Add custom CSS and index page
          echo '<meta http-equiv="refresh" content="0; url=kompute">' > target/doc/index.html

      - name: Setup versioned docs structure
        run: |
          # Create versioned docs directory
          mkdir -p docs

          # Get current version info
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Building docs for release version: $VERSION"

            # Copy current docs to versioned folder
            cp -r target/doc docs/$VERSION

            # Update latest symlink for releases
            cd docs
            rm -f latest
            ln -sf $VERSION latest
            cd ..

            # Create version index
            echo "Creating version index for release $VERSION"
          else
            echo "Building docs for main branch"

            # Copy current docs to main folder
            cp -r target/doc docs/main

            # For main branch, also create 'latest' if it doesn't exist
            if [ ! -d docs/latest ]; then
              cd docs
              ln -sf main latest
              cd ..
            fi
          fi

      - name: Create documentation index
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Komputers Documentation</title>
              <style>
                  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
                  .header { text-align: center; margin-bottom: 2rem; }
                  .version-list { list-style: none; padding: 0; }
                  .version-list li { margin: 0.5rem 0; }
                  .version-list a {
                      display: block;
                      padding: 1rem;
                      background: #f5f5f5;
                      border-radius: 8px;
                      text-decoration: none;
                      color: #333;
                  }
                  .version-list a:hover { background: #e0e0e0; }
                  .latest { background: #e8f4fd !important; border: 2px solid #0066cc; }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>🚀 Komputers Documentation</h1>
                  <p>Production-ready GPU computing for Rust with Vulkan</p>
              </div>

              <h2>📚 Available Versions</h2>
              <ul class="version-list">
                  <li><a href="latest/kompute/" class="latest">📌 Latest Stable</a></li>
                  <li><a href="main/kompute/">🔧 Development (main branch)</a></li>
              </ul>

              <h2>🔗 External Links</h2>
              <ul class="version-list">
                  <li><a href="https://crates.io/crates/kompute">📦 crates.io</a></li>
                  <li><a href="https://github.com/axiomantic/komputers">💻 GitHub Repository</a></li>
                  <li><a href="https://github.com/axiomantic/komputers/tree/main/kompute/examples">📋 Examples</a></li>
              </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
