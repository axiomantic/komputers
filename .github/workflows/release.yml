name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Komputers v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Komputers v${{ steps.get_version.outputs.VERSION }}

            Production-ready GPU computing for Rust with Vulkan.

            ### Installation

            ```toml
            [dependencies]
            kompute = "${{ steps.get_version.outputs.VERSION }}"
            ```

            ### Quick Start

            ```rust
            use kompute::{Manager, Tensor, Algorithm};

            fn main() -> kompute::Result<()> {
                let mut manager = Manager::new()?;
                let input = Tensor::new(&mut manager, &[1.0f32, 2.0, 3.0, 4.0])?;
                println!("GPU tensor created: {:?}", input.to_vec()?);
                Ok(())
            }
            ```

            ### Platform Support
            - ✅ **macOS**: Apple Silicon + Intel with MoltenVK
            - ✅ **Linux**: Native Vulkan drivers (NVIDIA, AMD, Intel)
            - ✅ **Windows**: Native Vulkan drivers

            ### Features
            - Multi-type GPU tensors (f32, f64, i32, u32)
            - SPIR-V compute shader integration
            - Async GPU operations (feature-gated)
            - Comprehensive error handling and recovery
            - Memory optimization and resource tracking
            - Cross-platform Vulkan environment setup

            See [CHANGELOG.md](https://github.com/axiomantic/komputers/blob/main/CHANGELOG.md) for complete details.

          draft: false
          prerelease: false

  test-release:
    name: Test Release Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Vulkan SDK
        run: |
          sudo apt update
          sudo apt install -y vulkan-tools libvulkan-dev cmake build-essential

      - name: Test package
        run: |
          cargo package --allow-dirty
          cargo publish --dry-run --allow-dirty

      - name: Verify documentation
        run: cargo doc --all-features --no-deps

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [create-release, test-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        run: |
          sudo apt update
          sudo apt install -y vulkan-tools libvulkan-dev cmake build-essential

      - name: Publish kompute-sys
        run: |
          cd kompute-sys
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true # May already be published

      - name: Wait for kompute-sys to be available
        run: sleep 60

      - name: Publish kompute
        run: |
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy-release-docs:
    name: Deploy Release Documentation
    runs-on: ubuntu-latest
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Trigger documentation deployment
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/docs.yml/dispatches \
            -d '{"ref":"${{ github.ref }}"}'
