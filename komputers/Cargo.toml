[package]
name = "komputers"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

# This is the high-level safe API crate
readme = "README.md"

[dependencies]
# Core dependencies
kompute-sys = { version = "0.1.0", path = "../kompute-sys" }
ash.workspace = true
thiserror.workspace = true
log.workspace = true
cxx = "1.0"

# Optional async support
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# GLSL compilation support
tempfile = { workspace = true, optional = true }

# Debug tools dependencies
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
# chrono removed - using std::time instead

# Crash debugging and analysis
backtrace = { version = "0.3", optional = true }
signal-hook = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }

# Benchmarking dependencies (optional - only needed for benchmarks)
criterion = { workspace = true, optional = true }

# Property testing dependencies (optional - only needed for property tests)
proptest = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true

[features]
default = ["kompute-master"]

# Kompute version support (exactly one must be enabled - for release we use only master)
kompute-master = ["kompute-sys/kompute-master"]
# NOTE: v0.9.0 and v0.8.1 are currently not supported for v0.1.0 release due to compatibility issues
# kompute-v090 = ["kompute-sys/kompute-v090"]
# kompute-v081 = ["kompute-sys/kompute-v081"]

# Production features for v0.1.0 release
async = ["tokio", "futures"]
glsl = ["tempfile"]
debug = ["serde", "serde_json", "uuid"]
validation = ["kompute-sys/validation"]
test-utils = []

# Development-only features (not included in production release)
# asan = ["kompute-sys/asan"]  # Commented out due to linker issues on macOS
# crash-debug = ["backtrace", "signal-hook", "libc"]
benchmarks = ["criterion"]
property-testing = ["proptest"]

[[example]]
name = "defensive_guards_demo"
path = "examples/defensive_guards_demo.rs"

[[example]]
name = "basic_gpu_computing"
path = "examples/basic_gpu_computing.rs"

[[example]]
name = "advanced_gpu_operations"
path = "examples/advanced_gpu_operations.rs"

[[example]]
name = "async_gpu_operations"
path = "examples/async_gpu_operations.rs"

[[example]]
name = "image_processing_pipeline"
path = "examples/image_processing_pipeline.rs"

[[example]]
name = "machine_learning_operations"
path = "examples/machine_learning_operations.rs"

[[example]]
name = "multi_type_tensors"
path = "examples/multi_type_tensors.rs"

[[example]]
name = "scientific_computing"
path = "examples/scientific_computing.rs"

# Revolutionary safety examples showcasing the hybrid validation system
[[example]]
name = "basic_gpu_safety"
path = "docs/examples/basic_gpu_safety.rs"

[[example]]
name = "cross_manager_safety"
path = "docs/examples/cross_manager_safety.rs"

[[example]]
name = "consuming_builder_safety"
path = "docs/examples/consuming_builder_safety.rs"

[[example]]
name = "spirv_algorithm_safety"
path = "docs/examples/spirv_algorithm_safety.rs"

[[example]]
name = "performance_safety_overhead"
path = "docs/examples/performance_safety_overhead.rs"

# Benchmarks will be added later
# [[bench]]
# name = "tensor_operations"
# harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Disable Vulkan version checking for docs.rs builds
rustc-env = { KOMPUTE_DISABLE_VULKAN_CHECK = "1" }
